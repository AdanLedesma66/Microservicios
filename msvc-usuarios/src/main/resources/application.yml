spring:
  application:
    name: msvc-usuarios
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql8}:${DB_PORT:3306}/${DB_DATABASE:msvc_usuarios}?serverTimezone=America/Asuncion
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:sasa}
    driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
      database-platform: org.hibernate.dialect.MySQL8Dialect
      generate-ddl: true
logging:
  file:
    path: /app/logs
  level:
    org:
      hibernate:
        SQL: debug
server:
  port: ${PORT:8001}

msvc:
  cursos:
    url: ${CURSOS_URL:msvc-cursos:8002}
